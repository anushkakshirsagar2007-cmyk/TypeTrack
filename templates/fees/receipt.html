{% extends "base.html" %}
{% block title %}Receipt {{ p.receipt_no }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Receipt {{ p.receipt_no }}</h1><p>{{ p.student.name }} &middot; {{ p.amount|inr }} &middot; {{ p.mode }}</p></div>
 <div class="d-flex gap-2 flex-wrap"><a class="btn btn-primary btn-lg" href="{{ url_for('fees.receipt_pdf', id=p.id, download=1) }}"><i class="bi bi-download"></i> Download PDF</a>
  <a class="btn btn-outline-primary btn-lg" target="_blank" href="{{ url_for('fees.receipt_pdf', id=p.id) }}"><i class="bi bi-printer"></i> Print</a>
  <a class="btn btn-light btn-lg" href="{{ url_for('students.profile', id=p.student_id) }}">Student profile</a></div></div>
<div class="card"><div class="card-body p-0"><iframe src="{{ url_for('fees.receipt_pdf', id=p.id) }}" class="receipt-frame" title="Receipt preview"></iframe></div></div>
{% endblock %}
